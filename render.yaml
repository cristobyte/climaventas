# Render.com Blueprint for ClimaVentas CRM
# Deploy both backend and frontend services
# Uses SQLite with fresh seed data on each deploy (free tier limitation)

services:
  # Backend API Service
  - type: web
    name: climaventas-api
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: NODE_ENV=development npm ci && npm run prisma:generate && npm run build
    startCommand: mkdir -p data && npx prisma db push --skip-generate && npm run prisma:seed && node dist/src/main
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./data/climaventas.db
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false

  # Frontend Next.js Service
  - type: web
    name: climaventas-web
    runtime: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: PORT
        value: 3000
