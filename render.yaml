# Render.com Blueprint for ClimaVentas CRM
# Deploy both backend and frontend services

databases:
  - name: climaventas-db
    plan: free
    region: oregon

services:
  # Backend API Service
  - type: web
    name: climaventas-api
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: NODE_ENV=development npm ci && npm run prisma:generate && npm run build
    startCommand: npm run prisma:migrate:prod && node dist/src/main
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: climaventas-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false

  # Frontend Next.js Service
  - type: web
    name: climaventas-web
    runtime: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: PORT
        value: 3000
